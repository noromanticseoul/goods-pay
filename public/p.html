<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>굿즈 결제</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body><div class="app" id="app"><p>불러오는 중…</p></div>
<script src="/common.js"></script>
<script>
const app = $('#app'), Q = new URLSearchParams(location.search);
let P, S, qty = 1, code = '', quote = null, order = null, poll;

async function boot() {
  if (Q.get('o')) { order = await api('/api/orders/' + Q.get('o')); P = order.product; S = order.seller; return order.status === 'paid' ? done() : wait(); }
  try { ({ product: P, seller: S } = await api('/api/public/product/' + Q.get('id'))); } catch (e) { app.innerHTML = `<h1>상품을 찾을 수 없어요</h1><p>${esc(e.message)}</p>`; return; }
  await requote(); page();
}
async function requote() { try { quote = await api('/api/quote', { body: { productId: P.id, qty, code } }); quote.err = ''; } catch (e) { const c = code; code = ''; quote = await api('/api/quote', { body: { productId: P.id, qty } }); quote.err = e.message; quote.tried = c; } }
function page() {
  app.innerHTML = `<p class="small">${esc(S.name)}${S.version === 'biz' ? ' · 사업자' : ''}</p>
  ${P.images[0] ? `<img class="img" src="${P.images[0]}" alt="${esc(P.name)}">` : ''}
  <div class="row"><b style="font-size:18px">${esc(P.name)}</b><span>개당 ${won(P.price)}</span></div>
  <div class="row"><span>수량</span><div class="stp"><button id="mi" aria-label="수량 빼기">−</button><b>${qty}</b><button id="pl" aria-label="수량 더하기">+</button></div></div>
  <div style="display:flex;flex-direction:column;gap:6px"><label for="cd" style="font-size:13px;font-weight:700">할인 및 쿠폰</label>
  <div style="display:flex;gap:8px"><input id="cd" placeholder="코드 입력" value="${esc(code || quote.tried || '')}"><button class="b3" id="ap">적용</button></div>
  ${quote.label ? `<p class="ok">✓ ${esc(quote.label)}이 반영되었습니다</p>` : ''}${quote.err ? `<p class="err">${esc(quote.err)}</p>` : ''}</div>
  <div class="card" style="gap:4px"><div class="row"><p>상품 금액</p><p>${won(quote.subtotal)}</p></div>
  ${quote.discount ? `<div class="row"><p style="color:var(--blue)">${esc(quote.label)}</p><p style="color:var(--blue)">−${won(quote.discount)}</p></div>` : ''}
  <div class="row"><b>보낼 금액</b><span class="amt">${won(quote.base)}</span></div>
  <p class="small" style="text-align:right">+ 확인용 끝자리(1~99원)는 결제 방법을 누르면 정해져요</p></div>
  ${S.tossId ? '<button data-m="toss">토스로 보내기</button>' : ''}
  <div style="display:flex;gap:8px">${S.kakaoLink ? '<button class="b2" data-m="kakao">카카오페이</button>' : ''}<button class="${S.tossId ? 'b2' : ''}" data-m="copy">계좌번호 복사</button></div>
  <p class="small" style="text-align:center">토스뱅크 계좌가 없어도 토스 앱만 있으면 보낼 수 있어요</p>`;
  $('#mi').onclick = async () => { qty = Math.max(1, qty - 1); await requote(); page(); };
  $('#pl').onclick = async () => { qty = Math.min(P.maxQty || 10, qty + 1); await requote(); page(); };
  $('#ap').onclick = async () => { code = $('#cd').value.trim(); await requote(); page(); };
  app.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => pay(b.dataset.m)));
}
async function pay(m) {
  order = await api('/api/orders', { body: { productId: P.id, qty, code, method: m } });
  history.replaceState(null, '', '?o=' + order.id);
  const acct = `${S.bank} ${S.account}`;
  if (m === 'toss') location.href = `https://toss.me/${encodeURIComponent(S.tossId)}/${order.amount}`;
  if (m === 'kakao') { await copy(String(order.amount), `${won(order.amount)}을 복사했어요`); window.open(S.kakaoLink, '_blank'); }
  if (m === 'copy') await copy(acct, '계좌번호를 복사했어요');
  wait();
}
function wait() {
  app.innerHTML = `<h1>${won(order.amount)}을<br>정확히 보내주세요</h1>
  <div class="card"><div class="row"><span>은행</span><b>${esc(S.bank)}</b></div><div class="row"><span>계좌</span><b>${esc(S.account)}</b></div><div class="row"><span>받는 분</span><b>${esc(S.holder)}</b></div>
  <div class="row"><span>금액</span><span style="display:flex;gap:8px;align-items:center"><b>${won(order.amount)}</b><button class="b3 sm" id="ca">금액 복사</button></span></div>
  <button class="b2" id="cc">계좌번호 복사</button></div>
  <div class="ring" aria-hidden="true"></div><h2 style="text-align:center">입금 확인 중이에요</h2>
  <p style="text-align:center">${esc(order.product.name)} ${order.qty}개 · 주문 ${order.no}<br>보내고 나면 보통 10초 안에 바뀌어요. 이 화면을 켜두세요.</p>
  <div class="card hide" id="late"><b>30초가 지나도 그대로라면</b><p>판매자에게 이 화면을 보여주세요. 판매자가 바로 확인해 드려요.</p></div>`;
  $('#ca').onclick = () => copy(String(order.amount), '금액을 복사했어요'); $('#cc').onclick = () => copy(`${S.bank} ${S.account}`, '계좌번호를 복사했어요');
  const t0 = Date.now(); clearInterval(poll);
  poll = setInterval(async () => { if (Date.now() - t0 > 30000) $('#late')?.classList.remove('hide'); const o = await api('/api/orders/' + order.id); if (o.status === 'paid') { order = o; clearInterval(poll); done(); } if (o.status === 'expired') { clearInterval(poll); app.innerHTML = '<h1>주문 시간이 지났어요</h1><p>QR을 다시 찍어주세요. 이미 보냈다면 판매자에게 말씀해주세요.</p>'; } }, 2000);
}
function done() {
  document.body.classList.add('done'); app.classList.add('done');
  app.innerHTML = `<div class="sp"></div><div class="check"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="완료"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1 style="text-align:center">결제 완료</h1><div class="card" style="background:#fff">
  <div class="row"><span>상품</span><b>${esc(order.product.name)} × ${order.qty}</b></div><div class="row"><span>금액</span><b>${won(order.amount)}</b></div>
  ${order.discount ? `<div class="row"><span>할인</span><b>${esc(order.label)} −${won(order.discount)}</b></div>` : ''}<div class="row"><span>주문</span><b>${order.no}</b></div><div class="row"><span>지금 시각</span><b id="clk"></b></div></div>
  <a class="btn b2" style="background:#fff" href="/r.html?id=${order.id}">영수증 받기</a><div class="sp"></div>
  <p style="text-align:center;font-weight:700;color:var(--green)">판매자에게 이 화면을 보여주세요</p>`;
  const tick = () => { const c = $('#clk'); if (c) c.textContent = new Date().toLocaleTimeString('ko-KR', { hour12: false }); }; tick(); setInterval(tick, 1000);
}
boot();
</script></body></html>
