<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>굿즈 고르고 결제</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><style>.gd{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bg)}.gd img,.gd .gi{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--bg);flex:none}.gd .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px}.gd .t span{color:var(--sub);font-size:14px}</style></head><body><div class="app" id="app"><p>불러오는 중…</p></div>
<script src="/common.js"></script>
<script>
const app = $('#app'), Q = new URLSearchParams(location.search);
let PS = [], S, cart = {}, code = '', quote = null, order = null, poll;

async function boot() {
  if (Q.get('o')) { order = await api('/api/orders/' + Q.get('o')); S = order.seller; return order.status === 'paid' ? done() : wait(); }
  try { ({ products: PS, seller: S } = await api('/api/public/shop')); } catch (e) { app.innerHTML = `<h1>가게를 찾을 수 없어요</h1><p>QR을 다시 찍어주세요.</p>`; return; }
  if (PS.length === 1) cart[PS[0].id] = 1;
  await requote(); page();
}
const items = () => Object.entries(cart).filter(([, q]) => q > 0).map(([productId, qty]) => ({ productId, qty }));
async function requote() { try { quote = await api('/api/quote', { body: { items: items(), code } }); quote.err = ''; } catch (e) { const c = code; code = ''; quote = await api('/api/quote', { body: { items: items() } }); quote.err = e.message; quote.tried = c; } }
function page() {
  const n = items().reduce((a, i) => a + i.qty, 0);
  app.classList.add('wide');
  app.innerHTML = `<div><p class="small">${S.version === 'biz' ? '사업자 · ' : ''}굿즈 ${PS.length}개</p><h1>${esc(S.name)}</h1></div>
  <div class="cols"><div class="c1 gl">${PS.length ? PS.map((p) => `<div class="gd">${thumb(p, 'gi')}<div class="t"><b>${esc(p.name)}</b><span>${won(p.price)}</span></div>
    <div class="stp"><button data-mi="${p.id}" aria-label="${esc(p.name)} 빼기">−</button><b>${cart[p.id] || 0}</b><button data-pl="${p.id}" aria-label="${esc(p.name)} 더하기">+</button></div></div>`).join('') : '<p>아직 등록된 굿즈가 없어요.</p>'}</div><div class="c2 sticky">
  <div style="display:flex;flex-direction:column;gap:6px"><label for="cd" style="font-size:13px;font-weight:700">할인 및 쿠폰</label>
  <div style="display:flex;gap:8px"><input id="cd" placeholder="코드 입력" value="${esc(code || quote.tried || '')}"><button class="b3" id="ap">적용</button></div>
  ${quote.bundle ? `<p class="ok">✓ 결합 할인이 적용되었어요 · ${esc(quote.bundle.name)}${quote.bundle.sets > 1 ? ` (${quote.bundle.sets}세트)` : ''}</p>` : quote.label ? `<p class="ok">✓ ${esc(quote.label)}이 반영되었습니다</p>` : ''}${quote.note ? `<p class="small">${esc(quote.note)}</p>` : ''}<p class="small" style="color:var(--mute)">결합 할인과 코드는 더 큰 할인 하나만 적용돼요</p>${quote.err ? `<p class="err">${esc(quote.err)}</p>` : ''}</div>
  <div class="card" style="gap:4px"><div class="row"><p>상품 금액 · ${n}개</p><p>${won(quote.subtotal)}</p></div>
  ${quote.discount ? `<div class="row"><p style="color:var(--blue)">${esc(quote.label)}</p><p style="color:var(--blue)">−${won(quote.discount)}</p></div>` : ''}
  <div class="row"><b>보낼 금액</b><span class="amt">${won(quote.base)}</span></div></div>
  ${n ? `${S.tossId ? '<button data-m="toss">토스로 보내기</button>' : ''}
  <div style="display:flex;gap:8px">${S.kakaoLink ? '<button class="b2" data-m="kakao">카카오페이</button>' : ''}<button class="${S.tossId ? 'b2' : ''}" data-m="copy">계좌번호 복사</button></div>
  <p class="small" style="text-align:center">토스뱅크 계좌가 없어도 토스 앱만 있으면 보낼 수 있어요</p>` : '<p class="small" style="text-align:center">살 굿즈의 수량을 + 로 골라주세요</p>'}</div></div>`;
  const set = async (id, d) => { const p = PS.find((x) => x.id === id); cart[id] = Math.max(0, Math.min(p.maxQty || 10, (cart[id] || 0) + d)); await requote(); page(); };
  app.querySelectorAll('[data-mi]').forEach((b) => (b.onclick = () => set(b.dataset.mi, -1)));
  app.querySelectorAll('[data-pl]').forEach((b) => (b.onclick = () => set(b.dataset.pl, 1)));
  $('#ap').onclick = async () => { code = $('#cd').value.trim(); await requote(); page(); };
  app.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => pay(b.dataset.m)));
}
async function pay(m) {
  order = await api('/api/orders', { body: { items: items(), code, method: m } });
  history.replaceState(null, '', `?s=${S.shopId}&o=${order.id}`);
  const acct = `${S.bank} ${S.account}`;
  if (m === 'toss') location.href = `https://toss.me/${encodeURIComponent(S.tossId)}/${order.amount}`;
  if (m === 'kakao') { await copy(String(order.amount), `${won(order.amount)}을 복사했어요`); window.open(S.kakaoLink, '_blank'); }
  if (m === 'copy') await copy(acct, '계좌번호를 복사했어요');
  wait();
}
function wait() {
  app.classList.remove('wide');
  app.innerHTML = `<div class="navr"><button class="back" id="bk">← 다시 고르기</button><a class="back" href="?s=${S.shopId}">처음으로</a></div><h1>${won(order.amount)}을<br>보내주세요</h1>
  <div class="card"><div class="row"><span>은행</span><b>${esc(S.bank)}</b></div><div class="row"><span>계좌</span><b>${esc(S.account)}</b></div><div class="row"><span>받는 분</span><b>${esc(S.holder)}</b></div>
  <div class="row"><span>금액</span><span style="display:flex;gap:8px;align-items:center"><b>${won(order.amount)}</b><button class="b3 sm" id="ca">금액 복사</button></span></div>
  <button class="b2" id="cc">계좌번호 복사</button></div>
  <p style="text-align:center">${esc(order.title)} · 주문 ${order.no}<br>송금을 마치면 아래 버튼을 눌러주세요.</p><div class="sp"></div>
  <button class="b1" id="sent">송금했어요</button>`;
  $('#bk').onclick = () => { if (!PS.length) return (location.href = '?s=' + S.shopId); history.replaceState(null, '', '?s=' + S.shopId); page(); };
  $('#ca').onclick = () => copy(String(order.amount), '금액을 복사했어요'); $('#cc').onclick = () => copy(`${S.bank} ${S.account}`, '계좌번호를 복사했어요');
  $('#sent').onclick = async (e) => { e.target.disabled = true; try { order = await api('/api/orders/' + order.id + '/sent', { body: {} }); done(); } catch (err) { e.target.disabled = false; app.insertAdjacentHTML('beforeend', `<p style="text-align:center;color:var(--red,#f04452)">${esc(err.message || '다시 시도해주세요')}</p>`); } };
}
function done() {
  app.classList.remove('wide');
  document.body.classList.add('done'); app.classList.add('done');
  app.innerHTML = `<div class="sp"></div><div class="check"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="완료"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1 style="text-align:center">결제 완료</h1><div class="card" style="background:#fff">
  ${order.items.map((l) => `<div class="row"><span>${esc(l.name)}</span><b>× ${l.qty}</b></div>`).join('')}<div class="row"><span>금액</span><b>${won(order.amount)}</b></div>
  ${order.discount ? `<div class="row"><span>할인</span><b>${esc(order.label)} −${won(order.discount)}</b></div>` : ''}<div class="row"><span>주문</span><b>${order.no}</b></div><div class="row"><span>지금 시각</span><b id="clk"></b></div></div>
  <a class="btn b2" style="background:#fff" href="r.html?s=${S.shopId}&id=${order.id}">영수증 받기</a><div class="sp"></div>
  <p style="text-align:center;font-weight:700;color:var(--green)">판매자에게 이 화면을 보여주세요</p><a class="back" style="align-self:center" href="?s=${S.shopId}">처음으로 · 더 사기</a>`;
  const tick = () => { const c = $('#clk'); if (c) c.textContent = new Date().toLocaleTimeString('ko-KR', { hour12: false }); }; tick(); setInterval(tick, 1000);
}
boot();
</script></body></html>
