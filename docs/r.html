<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>구매 영수증</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="vendor/html2canvas.min.js"></script>
<style>.rc{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;background:#fff}.rl{border-top:1px dashed #D1D6DB;margin:4px 0}
@media print{body{background:#fff}.noprint{display:none!important}.app{padding:0}}</style></head>
<body><div class="app" id="app"><p>불러오는 중…</p></div>
<script src="common.js"></script><script src="demo-api.js"></script>
<script>
(async () => {
  const id = location.hash.slice(1); let o;
  try { o = await api('/api/orders/' + id); } catch { $('#app').innerHTML = '<h1>영수증을 찾을 수 없어요</h1>'; return; }
  if (o.status !== 'paid') { $('#app').innerHTML = '<h1>아직 결제가 확인되지 않았어요</h1><p>입금이 확인되면 영수증을 받을 수 있어요.</p>'; return; }
  const S = o.seller, biz = S.version === 'biz', dt = (t) => { const d = new Date(t), z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}.${z(d.getMonth() + 1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
  const how = { toss: '토스 송금', kakao: '카카오페이 송금', copy: '계좌 송금', transfer: '계좌 송금' }[o.method] || '계좌 송금';
  $('#app').innerHTML = `<h1 class="noprint">구매 영수증</h1>
  <div class="rc" id="rc"><div class="row"><b style="font-size:17px">${esc(S.name)}</b><span class="small mute">주문 ${o.no}</span></div>
  ${biz ? `<p class="small">사업자등록번호 ${esc(S.bizNo)}</p>` : ''}<p class="small">결제 ${dt(o.createdAt)} · 입금 확인 ${dt(o.paidAt)}</p><div class="rl"></div>
  <div class="row"><span>${esc(o.product.name)} ${won(o.unitPrice)} × ${o.qty}</span><span>${won(o.subtotal)}</span></div>
  ${o.discount ? `<div class="row"><span>${esc(o.label)} (${esc(o.code)})</span><span>−${won(o.discount)}</span></div>` : ''}
  ${o.check ? `<div class="row"><span>결제 확인용 금액</span><span>+${won(o.check)}</span></div>` : ''}<div class="rl"></div>
  <div class="row"><b>합계</b><b style="font-size:20px">${won(o.amount)}</b></div><div class="row small"><span class="mute">결제 방법</span><span>${how}</span></div>
  ${o.cashReceipt ? `<div class="row small"><span class="mute">현금영수증</span><span>${o.cashReceipt.issued ? '발행 완료' : '발행 요청됨'} (${o.cashReceipt.type === 'expense' ? '지출증빙' : '소득공제'})</span></div>` : ''}
  <p class="small mute" style="text-align:center">진위 확인 주문 ${o.no}</p></div>
  ${biz ? (o.cashReceipt ? '' : `<div class="card noprint" id="cr"><b>현금영수증 받기</b><select id="ct"><option value="expense">회사 지출증빙 · 사업자번호</option><option value="income">개인 소득공제 · 휴대폰 번호</option></select><input id="cn" inputmode="numeric" placeholder="번호 입력"><button class="b2" id="cb">현금영수증 신청</button></div>`)
       : `<div class="warn noprint"><b>회사 경비로 쓰실 건가요?</b><br>사업자등록이 없는 판매자의 영수증이라 현금영수증·세금계산서는 아니에요. 인정 여부는 회사마다 달라서, 은행 앱 이체확인증과 함께 내시길 권해요.</div>`}
  <div class="sp"></div><button class="noprint" id="img">이미지로 저장</button><button class="b2 noprint" onclick="print()">PDF로 저장 (인쇄)</button>`;
  $('#img').onclick = async () => { const c = await html2canvas($('#rc'), { scale: 2, backgroundColor: '#fff' }); const a = document.createElement('a'); a.download = `영수증_${o.no}.png`; a.href = c.toDataURL('image/png'); a.click(); };
  const cb = $('#cb'); if (cb) cb.onclick = async () => { try { await api(`/api/orders/${o.id}/cash-receipt`, { body: { type: $('#ct').value, number: $('#cn').value } }); toast('신청했어요. 판매자가 발행하면 반영돼요'); setTimeout(() => location.reload(), 1200); } catch (e) { toast(e.message); } };
})();
</script></body></html>
